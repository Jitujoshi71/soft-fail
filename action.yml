name: 'soft-fail'
description: 'GitLab-style allow_failure for GitHub Actions: a failed step stays visible as a neutral check run, job stays green.'
author: 'Jitujoshi71'
inputs:
  run:
    description: 'Command to run'
    required: true
  check-name:
    description: 'Name of the check run created on soft failure'
    required: false
    default: 'soft-fail'
  working-directory:
    description: 'Directory to run the command in'
    required: false
    default: ''
  shell:
    description: 'Shell to run the command with: bash, sh, or pwsh'
    required: false
    default: 'bash'
  create-summary:
    description: 'Add a job summary entry when the command fails softly (true/false)'
    required: false
    default: 'true'
  comment-on-pr:
    description: 'Post or update a comment on the pull request listing soft failures, and remove it when a later run has none (true/false). Needs pull-requests: write; only applies to pull_request events'
    required: false
    default: 'false'
  token:
    description: 'Token used to create the check run (needs checks: write)'
    required: false
    default: '${{ github.token }}'
outputs:
  outcome:
    description: '"success" or "soft-failed"'
  exit-code:
    description: 'Exit code of the command'
runs:
  using: 'node24'
  main: 'dist/index.js'
branding:
  icon: 'check-circle'
  color: 'green'
